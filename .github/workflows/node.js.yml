name: Node.js CI

on:
    push:
      branches: [ "Develop" ]
    pull_request:
      branches: [ "Develop" ]

jobs:                                                                                                                                                  
    build:
      runs-on: ubuntu-latest                                                                                                                             
                  
      steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x                                                                                                                             
          cache: 'npm'
      - run: npm install                                                                                                                                     
      - run: cd client && npm install
      - run: cd server && npm install
      - run: cd client && npm run build
                                                                                                                                                         
    test:
      runs-on: ubuntu-latest                                                                                                                             
      needs: build

      steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:                                                                                                                                            
          node-version: 20.x
          cache: 'npm'                                                                                                                                   
      - run: npm install
      - run: cd client && npm install
      - run: cd server && npm install
      - name: Test client
        run: cd client && npm test                                                                                                                       
      - name: Test server
        run: cd server && npm test
